[build-system]
requires = ["briefcase"]

[tool.briefcase]
project_name = "BudgetWise-AI"
bundle = "org.budgetwise"
version = "0.1"
url = "https://github.com/specrthyahskod/BudgetWise-AI"
license = "MIT"
author = "Riddhiman"

[tool.briefcase.app.budgetwiseai]
formal_name = "BudgetWise AI"
description = "Your AI-powered student finance companion"
icon = "assets/BudgetWise_AI_logo"
sources = [
    "budgetwiseai",
    "assets"
]
license = "MIT"
requires = [
    "PyQt5>=5.15.0",
    "requests>=2.31.0",
    "openpyxl>=3.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "joblib>=1.1.0",
    "pillow>=10.0.0",
    "python-dateutil>=2.8.2"
]

[tool.briefcase.app.budgetwiseai.android]
build_style = "apk"
# Override requires specifically for Android
requires = [
    "kivy>=2.3.0",
    "requests>=2.31.0",
    "openpyxl>=3.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "joblib>=1.1.0",
    "pillow>=10.0.0",
    "python-dateutil>=2.8.2"
]
build_gradle_dependencies = [
    "androidx.appcompat:appcompat:1.6.1",
    "androidx.constraintlayout:constraintlayout:2.1.4",
    "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0",
    "androidx.recyclerview:recyclerview:1.3.1",
    "androidx.cardview:cardview:1.0.0"
]

[tool.briefcase.app.budgetwiseai.android.chaquopy]
target_api = 34
min_sdk_version = 21
permissions = [
    "android.permission.INTERNET",
    "android.permission.READ_EXTERNAL_STORAGE",
    "android.permission.WRITE_EXTERNAL_STORAGE",
    "android.permission.ACCESS_NETWORK_STATE"
]
