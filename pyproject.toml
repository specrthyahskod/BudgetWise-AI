[build-system]
requires = ["briefcase"]

[tool.briefcase]
project_name = "BudgetWise-AI"
bundle = "org.budgetwise"
version = "0.1"
url = "https://github.com/specrthyahskod/BudgetWise-AI"
license = "MIT"
author = "Riddhiman"

[tool.briefcase.app.budgetwiseai]
formal_name = "BudgetWise AI"
description = "Your AI-powered student finance companion"
icon = "assets/BudgetWise_AI_logo"
sources = [
    "budgetwiseai",
    "assets"
]
license = "MIT"
requires = [
    "PyQt5",
    "requests",
    "openpyxl"
]

[tool.briefcase.app.budgetwiseai.android]
build_style = "apk"
build_gradle_dependencies = [
    "androidx.appcompat:appcompat:1.0.2",
    "androidx.constraintlayout:constraintlayout:1.1.3",
    "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
]