name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Enable i386 Architecture & Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          libffi-dev libssl-dev build-essential ccache \
          libncurses6:i386 libstdc++6:i386 zlib1g:i386 zlib1g-dev libsqlite3-dev

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer cython

    - name: Pre-accept Android SDK Licenses & Run Buildozer
      run: |
        # Pre-create SDK licenses directory to prevent sdkmanager prompts
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/licenses"
        echo -e "\n8933010224545813973e16f7be49cb28048d6b15\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
        
        # Run Buildozer in batch mode
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BudgetWiseAI-APK
        path: bin/*.apk