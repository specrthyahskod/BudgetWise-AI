name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Enable i386 Architecture & Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          libffi-dev libssl-dev build-essential ccache \
          libncurses6:i386 libstdc++6:i386 zlib1g:i386 zlib1g-dev libsqlite3-dev

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer cython

    - name: Build APK with Buildozer
      run: |
        # Clear GitHub runner NDK environment variables that conflict with Buildozer
        unset ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BudgetWiseAI-APK
        path: bin/*.apk