name: Build Android APK with Briefcase

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Briefcase & Dependencies
      run: |
        pip install --upgrade pip
        pip install briefcase

    - name: Initialize & Build Android Package
      run: |
        briefcase create android --no-input
        briefcase build android --no-input
        briefcase package android --no-input

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: BudgetWiseAI-APK
        path: android/gradle/app/build/outputs/apk/debug/*.apk